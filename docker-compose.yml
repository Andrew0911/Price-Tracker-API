version: "3.8"

services:
  # SERVICIUL BACKEND (API)
  backend:
    privileged: true
    container_name: api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/laravel.Dockerfile
    volumes:
      - ./laravel/:/var/www/html
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./docker/linux/fpm-pool.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./docker/linux/php-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/linux/opcache.ini:/usr/local/etc/php/conf.d/98-opcache.ini
      - ./docker/linux/openssl.cnf:/etc/ssl/openssl.cnf
      - ./docker/nginx.sample.conf:/etc/nginx/nginx.conf
    ports:
      - "8090:80"
    depends_on:
      - redis
      - mysql

  # SERVICIUL PYTHON (Scraper API)
  scraper:
    container_name: scraper
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/python.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./python:/app # Montăm codul pentru hot-reloading
    environment:
      - DATABASE_URL=mysql+pymysql://admin:secret@mysql:3306/price_tracker
    depends_on:
      - mysql
      - redis

  # SERVICIUL MYSQL (Baza de date)
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: price_tracker
      MYSQL_USER: admin
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # SERVICIUL REDIS (pentru async)
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # SERVICIUL REDIS INSIGHT (Interfața vizuală)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight-data:/data

volumes:
  mysql-data:
  redis-data:
  redisinsight-data:
