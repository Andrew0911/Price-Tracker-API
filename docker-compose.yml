services:
  backend:
    privileged: true
    container_name: api
    restart: always
    build:
      context: .
      dockerfile: ./docker/laravel/Dockerfile
    ports:
      - "8090:80"
    depends_on:
      - redis
      - mysql
    networks:
      - app_network

  scraper:
    container_name: scraper
    restart: always
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_DATABASE}
      - PROXY_URL=${PROXY_URL}
      - PROXY_ENV=${PROXY_ENV}
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - app_network

volumes:
  mysql-data:
  redis-data:

networks:
  app_network:
    external: true
