services:
  price-tracker-app:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - docker-network
    ports:
      - ${LARAVEL_PORT}:9000
    depends_on:
      - postgres_db
      - redis
    volumes:
      - ./laravel:/var/www/html

  queue-worker:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - docker-network
    depends_on:
      - postgres_db
      - redis
    command: php artisan queue:work
  
  postgres_db:
    image: postgres:16.3
    platform: linux/amd64
    ports:
      - ${POSTGRESQL_PORT}:5432
    restart: always
    volumes:
      - postgres_db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRESQL_DATABASE}
      - POSTGRES_USER=${POSTGRESQL_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
    networks:
      - docker-network

  redis:
    image: redis:7.2
    platform: linux/amd64
    ports:
      - ${REDIS_PORT}:6379
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - docker-network

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - price-tracker-app
    networks:
      - docker-network

volumes:
  postgres_db-data:
  redis-data:

networks:
  docker-network:
    driver: bridge
